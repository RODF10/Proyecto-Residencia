<div class="resultado-container">
  <h2>Resultado de la Encuesta: {{ nombreEncuesta }}</h2>
  <p><strong>Puntaje Total:</strong> {{ puntaje }} puntos</p>
  <p><strong>Nivel de Dependencia:</strong> {{ observacion }}</p>
  <!-- <p><strong>Nivel de Dependencia:</strong> {{ obtenerNivel() }}</p> -->
  <p><strong>Observación:</strong> {{ observacion }}</p>
</div>

<div class="d-grid gap-2 col-6 botones">
  <button class="btn btn-primary" type="button" (click)="funcionBoton(1)">Encuesta</button>
  <button class="btn btn-secondary" type="button" (click)="funcionBoton(2)">Categoria</button>
</div>
