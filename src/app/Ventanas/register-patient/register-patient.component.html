<!-- Modal para Registro de Paciente -->
<div class="container">
    <div class="title">
        <h1 class="modal-title fs-5" id="staticBackdropLabel"><i class="fa-solid fa-person-circle-plus"></i> Añadir Paciente</h1>
    </div>
    
    <div class="modal-body">
        <!-- Formulario de Registro -->
        <form [formGroup]="pacienteForm">
            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre" formControlName="nombre" [(ngModel)]="pacient.nombre">
                <div *ngIf="submitted && pacienteForm.controls['nombre'].errors">
                    <div *ngIf="pacienteForm.controls['nombre'].errors['required']" class="text-danger">Nombre es requerido
                    </div>
                </div>
            </div>
    
            <!-- Apellido -->
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" class="form-control" id="apellido" formControlName="apellido">
                <div *ngIf="submitted && pacienteForm.controls['apellido'].errors">
                    <div *ngIf="pacienteForm.controls['apellido'].errors['required']" class="text-danger">Apellido es
                        requerido</div>
                </div>
            </div>
    
            <!-- Genero -->
            <div class="form-group">
                <label for="genero">Género:</label>
                <select class="form-control" id="genero" formControlName="genero" [(ngModel)]="pacient.genero">
                    <option value="">Seleccione</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
                <div *ngIf="submitted && pacienteForm.controls['genero'].errors">
                    <div *ngIf="pacienteForm.controls['genero'].errors['required']" class="text-danger">Género es requerido
                    </div>
                </div>
            </div>
    
            <!-- Fecha Nacimiento -->
            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento: </label>
                <input type="date" id="fechaNacimiento" name="bday" required class="form-control"
                    [(ngModel)]="pacient.fecha_nacimiento">
            </div>
    
            <!-- Contacto de Emergencia -->
            <div class="form-group">
                <label for="telefono">Contacto de Emergencia:</label>
                <input type="text" class="form-control" id="telefono" formControlName="matricula" maxlength="10"
                    [(ngModel)]="pacient.telefono">
                <div *ngIf="submitted && pacienteForm.controls['matricula'].errors">
                    <div *ngIf="pacienteForm.controls['matricula'].errors['required']" class="text-danger">Número de
                        Emergencia es requerido</div>
                </div>
            </div>
    
            <!-- Domicilio -->
            <div class="form-group">
                <label for="caracteristicas">Domicilio:</label>
                <textarea class="form-control" id="caracteristicas" formControlName="caracteristicas" rows="3"
                    [(ngModel)]="pacient.direccion"></textarea>
                <div *ngIf="submitted && pacienteForm.controls['caracteristicas'].errors" class="text-danger">
                    <div *ngIf="pacienteForm.controls['caracteristicas'].errors['required']">Domicilio son requeridas</div>
                </div>
            </div>
    
            <!-- Email del Contacto -->
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" class="form-control" id="email" formControlName="enfermedad"
                    [(ngModel)]="pacient.email">
                <div *ngIf="submitted && pacienteForm.controls['enfermedad'].errors" class="text-danger">
                    <div *ngIf="pacienteForm.controls['enfermedad'].errors['required']">Correo es requerido</div>
                </div>
            </div>
    
            <!-- Edad del Paciente -->
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" class="form-control" id="edad" formControlName="edad" maxlength="3">
                <div *ngIf="submitted && pacienteForm.controls['edad'].errors" class="text-danger">
                    <div *ngIf="pacienteForm.controls['edad'].errors['required']">Edad es requerida</div>
                    <div *ngIf="pacienteForm.controls['edad'].errors['min']">Edad mínima es 1</div>
                </div>
            </div>
    
            <!-- Confirmación -->
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="confirmacion" formControlName="confirmacion">
                <label class="form-check-label" for="confirmacion">Confirmo que los datos ingresados son correctos</label>
                <div *ngIf="submitted && pacienteForm.controls['confirmacion'].errors" class="text-danger">
                    <div *ngIf="pacienteForm.controls['confirmacion'].errors['required']">La confirmación es requerida</div>
                </div>
            </div>
    
            <!-- Botones de acción -->
            <div class="text-center">
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"></i> Guardar</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fa-solid fa-circle-xmark"></i> Cancelar</button>
            </div>
        </form>
    </div>
</div>
