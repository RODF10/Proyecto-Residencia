<div class="cornell-scale">
  <h2>Escala de Cornell</h2>
  <p>Seleccione el puntaje adecuado para cada ítem.</p>

  <div *ngFor="let question of questions; let i = index" class="question">
    <label>{{ i + 1 }}. {{ question.text }}</label>
    <div class="options">
      <label>
        <input type="radio" name="q{{ i }}" (change)="setScore(i, 0)" /> 0 - Ausente
      </label>
      <label>
        <input type="radio" name="q{{ i }}" (change)="setScore(i, 1)" /> 1 - Leve
      </label>
      <label>
        <input type="radio" name="q{{ i }}" (change)="setScore(i, 2)" /> 2 - Severo
      </label>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" (click)="calculateScore()">Calcular Puntaje</button>
    <button 
      class="btn btn-success" 
      [disabled]="resultado === 0" 
      (click)="enviarResultados()">
      Enviar Resultados
    </button>
  </div>
