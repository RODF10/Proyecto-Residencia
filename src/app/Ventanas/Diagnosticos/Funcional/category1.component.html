<div class="katz containerEncuesta">
  <div class="titulo">
    <h2>Indice de KATZ</h2>
  </div>
</div>
<div class="barthel containerEncuesta" *ngIf="categoria == 'bartehl'">
  <div class="titulo">
    <h2>Indice de Barthel</h2>
  </div>
  <div class="opciones">
    <p class="instrucciones">Seleccione</p>
    <div *ngFor="let pregunta of preguntasBarthel; let i = index">
      <p class="preguntas">{{ pregunta.text }}</p>
      <div *ngFor="let opcion of pregunta.options">
        <label>
          <input type="radio" name="pregunta{{i}}" [value]="opcion.score" (change)="seleccionarRespuesta(i, opcion.score)"/> <!--[(ngModel)]="pregunta.respuestaSeleccionada"/>-->
          {{ opcion.label }}
        </label>
      </div>
    </div>
    <div *ngIf="mensajeError != ''" class="alert alert-danger mt-3">
      {{ mensajeError }}
    </div>
  </div>
</div>
<div class="lawton containerEncuesta">
  <div class="titulo">  
    <h2>Lawton y brody</h2>
  </div>
</div>
<div class="ensrud containerEncuesta" *ngIf="categoria == 'ensrud'">
  <div class="title">
    <h2>Criterios de Ensrud</h2>
  </div>
  <div class="opciones">
    <p class="instrucciones">Seleccione la respuesta segun considere que sea posible o que aplique segun su capacidad</p>
  <div *ngFor="let pregunta of preguntasEnsrud; let i = index">
    <label>
      <input type="checkbox" [checked]="pregunta.seleccionada" (change)="toggleCheckbox(i, $event)"/>
      {{ pregunta.text }}
    </label>
  </div>
  </div>
</div>
<div class="boton">
  <button type="submit" class="btn btn-success" (click)="finalizarEncuesta()">Finalizar</button>
</div>
